<text x="110" y="618" font-size="14" fill="#6B7280" font-family="Microsoft YaHei, Segoe UI, SimHei, sans-serif">算式：DeepSeek 87÷100=87.0%　|　Qwen 80÷100=80.0%　|　相减 = 7.0pp（共 100 题，1 题 = 1pp）</text>
<text x="110" y="644" font-size="14" fill="#6B7280" font-family="Microsoft YaHei, Segoe UI, SimHei, sans-serif">pp = 百分点，两数直接相减；若说「高出百分之几」则是 (87.0−80.0)÷80.0 = 8.75%，两种说法别混用。</text>
